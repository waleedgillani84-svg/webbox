<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#080b12"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>WebBox -- HTML & Website Manager</title>
<style>
:root{--bg:#080b12;--line:rgba(255,255,255,.07);--txt:#eef2ff;--muted:#8b97b5;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--txt);
  background-color:#080b12;
  background-image:radial-gradient(760px 420px at 10% -10%,rgba(79,125,255,.22),transparent 62%),
  radial-gradient(760px 420px at 95% 2%,rgba(124,92,255,.18),transparent 62%);
  background-attachment:fixed;background-repeat:no-repeat;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
body.lock{overflow:hidden;}
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:rgba(8,11,18,.78);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.06);}
.brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0;}
.logo{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,#4f7dff,#7c5cff);
  box-shadow:0 8px 22px rgba(79,125,255,.38),inset 0 1px 0 rgba(255,255,255,.28);
  font-size:19px;font-weight:800;color:#fff;}
.brand h1{margin:0;font-size:16.5px;font-weight:750;letter-spacing:-.3px;}
.brand p{margin:1px 0 0;font-size:11px;color:var(--muted);font-weight:500;}
.icon-btn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);
  background:rgba(255,255,255,.055);color:#cfd8ee;font-size:17px;
  display:grid;place-items:center;cursor:pointer;transition:.15s;position:relative;}
.icon-btn:active{transform:scale(.9);background:rgba(255,255,255,.1);}
.icon-btn .dot{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;
  background:#22c55e;border:2px solid #080b12;}
.searchwrap{padding:12px 14px 0;display:none;}
.searchwrap.show{display:block;}
.searchwrap input{width:100%;padding:13px 15px;border-radius:15px;border:1px solid var(--line);
  background:#101726;color:var(--txt);font-size:14px;outline:none;font-family:inherit;}
.searchwrap input:focus{border-color:rgba(79,125,255,.65);box-shadow:0 0 0 3px rgba(79,125,255,.15);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:13px;
  padding:16px 14px calc(120px + env(safe-area-inset-bottom));}
@media (max-width:390px){.grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:11px;padding:14px 12px 120px;}}
.card{position:relative;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,#161d2e,#111726);border:1px solid var(--line);
  box-shadow:0 6px 18px rgba(0,0,0,.34);transition:transform .16s;cursor:pointer;
  animation:pop .3s cubic-bezier(.2,.9,.3,1.15) backwards;}
@keyframes pop{from{opacity:0;transform:scale(.88);}to{opacity:1;transform:scale(1);}}
.card:active{transform:scale(.955);}
.thumb{position:relative;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(135deg,#1b2438,#111827);}
.thumb.link{background:linear-gradient(135deg,#1a2440,#0f1522);}
.thumb.html{background:linear-gradient(135deg,var(--g1),var(--g2));}
.thumb .glyph{font-size:30px;font-weight:800;color:rgba(255,255,255,.96);letter-spacing:-1.5px;
  text-shadow:0 3px 12px rgba(0,0,0,.3);}
.thumb .letter{position:absolute;font-size:52px;font-weight:800;color:rgba(255,255,255,.10);}
.thumb img.favi{position:relative;width:52px;height:52px;border-radius:14px;object-fit:contain;
  background:rgba(255,255,255,.07);padding:7px;box-shadow:0 6px 16px rgba(0,0,0,.35);}
.thumb .custom-emoji{font-size:52px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
.thumb img.custom-icon{width:56px;height:56px;border-radius:14px;object-fit:cover;
  background:rgba(255,255,255,.15);padding:2px;box-shadow:0 6px 16px rgba(0,0,0,.4);}
.card-menu{position:absolute;top:7px;right:7px;width:28px;height:28px;border-radius:9px;z-index:2;
  border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.45);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  color:#e7ecfb;font-size:15px;line-height:1;display:grid;place-items:center;cursor:pointer;}
.card-menu:active{transform:scale(.88);}
.card-body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:6px;}
.card-name{font-size:12.5px;font-weight:650;line-height:1.3;color:#e8edfb;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word;min-height:32px;}
.badge{font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  padding:3.5px 7px;border-radius:7px;align-self:flex-start;}
.badge.link{background:rgba(79,125,255,.18);color:#93b0ff;}
.badge.html{background:rgba(34,197,94,.16);color:#6ee7a0;}
.saved-dot{position:absolute;bottom:8px;left:8px;background:rgba(34,197,94,.92);
  color:#fff;font-size:9px;font-weight:800;padding:3px 7px;border-radius:7px;
  letter-spacing:.3px;box-shadow:0 2px 8px rgba(34,197,94,.45);}
.icon-dot{position:absolute;bottom:8px;right:8px;background:rgba(124,92,255,.92);
  color:#fff;font-size:10px;font-weight:700;padding:3px 6px;border-radius:7px;
  box-shadow:0 2px 8px rgba(124,92,255,.5);}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:64px 30px 120px;color:var(--muted);}
.empty[hidden]{display:none;}
.empty .eic{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;
  font-size:36px;background:linear-gradient(135deg,rgba(79,125,255,.2),rgba(124,92,255,.12));
  border:1px solid var(--line);margin-bottom:18px;}
.empty h2{margin:0 0 8px;font-size:17px;color:#dfe6f7;font-weight:700;}
.empty p{margin:0;font-size:13px;line-height:1.65;max-width:290px;}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;
  width:62px;height:62px;border-radius:21px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#4f7dff,#7c5cff);color:#fff;font-size:30px;font-weight:300;
  display:grid;place-items:center;box-shadow:0 14px 32px rgba(79,125,255,.45),
  inset 0 1px 0 rgba(255,255,255,.32);transition:transform .18s;}
.fab:active{transform:scale(.88) rotate(90deg);}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(3,5,10,.62);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .25s;}
.scrim.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;
  background:linear-gradient(180deg,#141b2b,#0d1320);border-radius:26px 26px 0 0;
  border-top:1px solid rgba(255,255,255,.09);
  padding:6px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(103%);transition:transform .34s cubic-bezier(.2,.85,.25,1);
  max-height:86vh;overflow-y:auto;box-shadow:0 -18px 50px rgba(0,0,0,.65);}
.sheet.show{transform:translateY(0);}
.handle{width:42px;height:4.5px;border-radius:3px;background:rgba(255,255,255,.18);margin:8px auto 16px;}
.sheet h3{margin:0 0 15px;font-size:16px;font-weight:700;word-break:break-word;}
.opt{display:flex;align-items:center;gap:13px;width:100%;padding:13px;border-radius:16px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);
  color:var(--txt);text-align:left;cursor:pointer;margin-bottom:10px;transition:.15s;font-family:inherit;}
.opt:active{transform:scale(.98);background:rgba(255,255,255,.09);}
.opt-ic{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;
  font-size:19px;background:linear-gradient(135deg,rgba(79,125,255,.25),rgba(124,92,255,.18));
  border:1px solid rgba(255,255,255,.08);}
.opt-t{font-size:14px;font-weight:650;}
.opt-d{font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-all;}
.fld{display:block;margin-bottom:13px;}
.fld span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
.fld input,.fld textarea{width:100%;padding:13px 14px;border-radius:14px;
  border:1px solid rgba(255,255,255,.09);background:#0b1120;color:var(--txt);
  font-size:14.5px;outline:none;font-family:inherit;resize:vertical;}
.fld input:focus,.fld textarea:focus{border-color:rgba(79,125,255,.65);
  box-shadow:0 0 0 3px rgba(79,125,255,.14);}
.btnrow{display:flex;gap:10px;margin-top:8px;}
.btn{flex:1;padding:14px;border-radius:15px;border:none;font-size:14.5px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:.15s;
  background:linear-gradient(135deg,#4f7dff,#7c5cff);color:#fff;
  box-shadow:0 8px 22px rgba(79,125,255,.32);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.ghost{background:rgba(255,255,255,.06);color:#c3cde6;box-shadow:none;border:1px solid var(--line);}
.btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 8px 22px rgba(239,68,68,.3);}
.btn:active:not(:disabled){transform:scale(.97);}
.infogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.infocell{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 11px;}
.infocell .k{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);margin-bottom:4px;}
.infocell .v{font-size:13px;font-weight:650;color:#dbe4f7;word-break:break-all;line-height:1.35;}
.infocell.wide{grid-column:1/-1;}
.infocell.ok .v{color:#6ee7a0;}
.codebox{background:#080d18;border:1px solid var(--line);border-radius:14px;padding:12px 13px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.55;
  color:#9fb0d1;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin-top:4px;}
.viewer{position:fixed;inset:0;z-index:90;background:#05070c;display:flex;flex-direction:column;
  opacity:0;transform:scale(.96);transition:opacity .22s,transform .22s;pointer-events:none;}
.viewer[hidden]{display:none;}
.viewer.open{opacity:1;transform:scale(1);pointer-events:auto;}
.vbar{display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  background:rgba(10,14,22,.92);border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);}
.vtitle{flex:1;font-size:13.5px;font-weight:650;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;padding:0 4px;min-width:0;}
.vbtn{width:38px;height:38px;flex:0 0 38px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.06);color:#dbe3f7;font-size:16px;
  display:grid;place-items:center;cursor:pointer;transition:.15s;}
.vbtn:active{transform:scale(.9);background:rgba(255,255,255,.13);}
.vbtn.save{background:rgba(34,197,94,.15);color:#6ee7a0;border-color:rgba(34,197,94,.3);}
#vFrame{flex:1;width:100%;border:0;background:#fff;display:block;}
.vnote{padding:9px 14px calc(9px + env(safe-area-inset-bottom));font-size:11.5px;
  color:#93a0bd;background:#0b101c;border-top:1px solid var(--line);
  display:flex;gap:8px;align-items:center;line-height:1.4;}
.vnote[hidden]{display:none;}
.vnote.ok{color:#6ee7a0;background:rgba(34,197,94,.08);}
.viewer.immersive .vbar{display:none;}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);background:rgba(20,27,43,.97);
  border:1px solid rgba(255,255,255,.1);color:var(--txt);
  padding:11px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:120;
  opacity:0;pointer-events:none;transition:.25s;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  max-width:88vw;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0 14px;
  max-height:240px;overflow-y:auto;padding:2px;}
@media (max-width:390px){.emoji-grid{grid-template-columns:repeat(5,1fr);}}
.emoji-btn{aspect-ratio:1/1;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);font-size:24px;cursor:pointer;
  display:grid;place-items:center;transition:.15s;font-family:inherit;}
.emoji-btn:active{transform:scale(.9);background:rgba(255,255,255,.12);}
.emoji-btn.selected{background:linear-gradient(135deg,#4f7dff,#7c5cff);border-color:#7c5cff;
  box-shadow:0 4px 14px rgba(79,125,255,.5);}
.trash-row{display:flex;align-items:center;gap:11px;padding:11px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:14px;margin-bottom:8px;}
.trash-thumb{width:48px;height:48px;flex:0 0 48px;border-radius:12px;
  display:grid;place-items:center;font-size:22px;overflow:hidden;
  background:linear-gradient(135deg,#1b2438,#111827);filter:grayscale(.5);}
.trash-thumb img{width:100%;height:100%;object-fit:cover;border-radius:12px;}
.trash-thumb .emoji{font-size:24px;}
.trash-info{flex:1;min-width:0;}
.trash-name{font-size:13px;font-weight:650;color:#dfe6f7;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.trash-days{font-size:10.5px;color:#f59e0b;font-weight:600;margin-top:3px;}
.trash-actions{display:flex;gap:6px;margin-top:8px;}
.mini-btn{padding:7px 11px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:#dbe3f7;font-size:11.5px;font-weight:650;
  cursor:pointer;font-family:inherit;transition:.15s;}
.mini-btn:active{transform:scale(.94);background:rgba(255,255,255,.12);}
.mini-btn.green{background:rgba(34,197,94,.15);color:#6ee7a0;border-color:rgba(34,197,94,.3);}
.mini-btn.red{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.3);}
</style>

<body>

<header class="appbar">
  <div class="brand">
    <div class="logo">◈</div>
    <div><h1>WebBox</h1><p id="countEl">0 items</p></div>
  </div>
  <button class="icon-btn" id="trashBtn" title="Trash">🗑️<span class="dot" id="trashDot" style="display:none"></span></button>
  <button class="icon-btn" id="searchBtn">🔍</button>
  <button class="icon-btn" id="menuBtn">⋮</button>
</header>

<div class="searchwrap" id="searchWrap">
  <input id="search" type="search" placeholder="Search..." autocomplete="off"/>
</div>

<div class="grid" id="grid"></div>

<div class="empty" id="empty">
  <div class="eic">🗂️</div>
  <h2>Kuch bhi add nahi hai</h2>
  <p>Neeche <b>+</b> button dabayein aur HTML file ya website link add karein.</p>
</div>

<button class="fab" id="fab">+</button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>

<div class="viewer" id="viewer" hidden>
  <div class="vbar">
    <button class="vbtn" id="vClose">←</button>
    <div class="vtitle" id="vTitle">Untitled</div>
    <button class="vbtn save" id="vSave" title="Save Entries">💾</button>
    <button class="vbtn" id="vReload">⟳</button>
    <button class="vbtn" id="vFs">⛶</button>
    <button class="vbtn" id="vOpen">↗</button>
  </div>
  <iframe id="vFrame" allow="fullscreen; autoplay; clipboard-read; clipboard-write; encrypted-media"
          allowfullscreen referrerpolicy="no-referrer"></iframe>
  <div class="vnote" id="vNote" hidden><span>⚠️</span><span>Website embed block kar sakti hai. <b>↗</b> se browser me kholein.</span></div>
  <div class="vnote ok" id="vLive" hidden><span>💾</span><span id="vLiveText">Entries auto-capture ho rahi hain...</span></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="filePicker" accept=".html,.htm,text/html" multiple hidden/>
<input type="file" id="jsonPicker" accept=".json,application/json" hidden/>
<input type="file" id="iconPicker" accept="image/*" hidden/>

<script>
(function(){
'use strict';

/* ============================================================
   PRISTINE HTML SNAPSHOT -- captured BEFORE any runtime changes
   ============================================================ */
const PRISTINE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const EXPORT_ID_STORAGE = 'webbox_last_export_id_v2';

/* ============ UTILS ============ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtBytes = n => {n=Number(n)||0;if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(1)+' KB';return (n/1024/1024).toFixed(2)+' MB';};
const fmtDate = ts => {if(!ts)return '--';const d=new Date(ts);return d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});};
const daysLeft = ts => {
  const remain = 30*24*60*60*1000 - (Date.now() - ts);
  return Math.max(0, Math.ceil(remain / (24*60*60*1000)));
};
const TRASH_MS = 30 * 24 * 60 * 60 * 1000;

const GRADS=[['#4f7dff','#7c5cff'],['#22c55e','#0ea5e9'],['#f59e0b','#ef4444'],['#ec4899','#8b5cf6'],['#06b6d4','#3b82f6'],['#f43f5e','#f97316'],['#14b8a6','#6366f1'],['#a855f7','#ec4899']];
function gradFor(id){let h=0;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return GRADS[h%GRADS.length];}
function faviconURL(url){try{return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(new URL(url).hostname)+'&sz=128';}catch(e){return '';}}
function ddgURL(url){try{return 'https://icons.duckduckgo.com/ip3/'+new URL(url).hostname+'.ico';}catch(e){return '';}}
function isImageIcon(icon){ return typeof icon === 'string' && icon.indexOf('data:image/') === 0; }
function safeLsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeLsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ============ STORAGE ============ */
const DB_NAME='webbox_db',DB_VER=1,STORE='items',LS_KEY='webbox_items_v2';
let _db=null,useFallback=false;
function openDB(){return new Promise((res,rej)=>{
  if(!('indexedDB' in window))return rej(new Error('no-idb'));
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});}
function lsAll(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch(e){return [];}}
function lsSave(a){try{localStorage.setItem(LS_KEY,JSON.stringify(a));}catch(e){}}
const Store={
  async all(){if(useFallback)return lsAll();try{const db=_db||(_db=await openDB());
    return await new Promise((res,rej)=>{const t=db.transaction(STORE,'readonly');
      const q=t.objectStore(STORE).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});
    }catch(e){useFallback=true;return lsAll();}},
  async put(item){
    if(useFallback){const a=lsAll();const i=a.findIndex(x=>x.id===item.id);
      if(i>=0)a[i]=item;else a.push(item);lsSave(a);return;}
    try{const db=_db||(_db=await openDB());await new Promise((res,rej)=>{
      const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(item);
      t.oncomplete=res;t.onerror=()=>rej(t.error);});
    }catch(e){useFallback=true;await Store.put(item);}},
  async del(id){
    if(useFallback){lsSave(lsAll().filter(x=>x.id!==id));return;}
    try{const db=_db||(_db=await openDB());await new Promise((res,rej)=>{
      const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);
      t.oncomplete=res;t.onerror=()=>rej(t.error);});
    }catch(e){useFallback=true;await Store.del(id);}},
  async clear(){
    if(useFallback){lsSave([]);return;}
    try{const db=_db||(_db=await openDB());await new Promise((res,rej)=>{
      const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).clear();
      t.oncomplete=res;t.onerror=()=>rej(t.error);});
    }catch(e){useFallback=true;await Store.clear();}}
};

/* ============ POSTMESSAGE ============ */
window.addEventListener('message',(e)=>{
  const d = e.data; if(!d || d.__webbox !== 'webbox-state' || !d.state) return;
  if(!currentItem || currentItem.type !== 'html') return;
  currentItem.liveState = d.state;
  const idx = items.findIndex(x=>x.id === currentItem.id);
  if(idx >= 0) items[idx].liveState = d.state;
  const n = Object.keys(d.state.formValues||{}).length +
            Object.keys(d.state.localStorage||{}).length +
            Object.keys(d.state.sessionStorage||{}).length;
  if(vLive && !vLive.hidden){
    vLiveText.textContent = '💾 ' + n + ' entr' + (n===1?'y':'ies') + ' auto-captured';
  }
  schedulePersist();
});
function schedulePersist(){
  if(persistTimer) clearTimeout(persistTimer);
  persistTimer = setTimeout(async ()=>{
    if(currentItem && currentItem.type === 'html' && currentItem.liveState){
      const idx = items.findIndex(x=>x.id === currentItem.id);
      if(idx >= 0){ items[idx].liveState = currentItem.liveState; try{ await Store.put(items[idx]); }catch(e){} }
    }
  }, 800);
}

/* ============ BUILD HTML WITH BRIDGE ============ */
function buildHTMLWithBridge(it){
  let html = it.content || '';
  const state = it.liveState || null;
  const stateJSON = state ? JSON.stringify(state).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029') : 'null';
  const closeScript = '<' + '/script>';
  const openScript = '<' + 'script>';
  const injection =
    openScript + 'window.__WEBBOX_INIT__=' + stateJSON + ';' + closeScript +
    openScript + BRIDGE_SCRIPT + closeScript;
  if(/<head[^>]*>/i.test(html)){
    html = html.replace(/<head[^>]*>/i, m => m + injection);
  }else if(/<html[^>]*>/i.test(html)){
    html = html.replace(/<html[^>]*>/i, m => m + '<head>' + injection + '</head>');
  }else if(/<body[^>]*>/i.test(html)){
    html = html.replace(/<body[^>]*>/i, m => injection + m);
  }else{
    html = injection + html;
  }
  return html;
}

/* ============ RENDER ============ */
function activeItems(){ return items.filter(i => !i.deletedAt); }
function trashedItems(){ return items.filter(i => i.deletedAt); }

function hasSavedEntries(it){
  const ls = it.liveState; if(!ls) return false;
  return (Object.keys(ls.localStorage||{}).length + Object.keys(ls.sessionStorage||{}).length + Object.keys(ls.formValues||{}).length) > 0;
}
function countEntries(it){
  const ls = it.liveState || {};
  return Object.keys(ls.localStorage||{}).length + Object.keys(ls.sessionStorage||{}).length + Object.keys(ls.formValues||{}).length;
}

function render(){
  const q = searchInp.value.trim().toLowerCase();
  let list = activeItems();
  if(q) list = list.filter(i =>
    (i.name||'').toLowerCase().includes(q) ||
    (i.url||'').toLowerCase().includes(q) ||
    (i.fileName||'').toLowerCase().includes(q));
  list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  grid.innerHTML = list.map((it,idx)=>cardHTML(it,idx)).join('');
  emptyEl.hidden = list.length > 0;
  countEl.textContent = activeItems().length + (activeItems().length===1 ? ' item' : ' items');
  const n = trashedItems().length;
  trashDot.style.display = n > 0 ? 'block' : 'none';
}

function iconHTML(it){
  const icon = it.icon;
  if(icon){
    if(isImageIcon(icon)) return '<img class="custom-icon" src="'+esc(icon)+'" alt=""/>';
    return '<span class="custom-emoji">'+esc(icon)+'</span>';
  }
  if(it.type === 'link'){
    let letter='?';
    try{ letter = (new URL(it.url).hostname.replace(/^www\./,'')[0]||'?').toUpperCase(); }catch(e){}
    const fav=faviconURL(it.url), fb=ddgURL(it.url);
    return '<span class="letter">'+esc(letter)+'</span>' +
      (fav ? '<img class="favi" src="'+esc(fav)+'" alt="" loading="lazy" data-fb="'+esc(fb)+'" ' +
        'onerror="if(!this.dataset.t){this.dataset.t=1;this.src=this.dataset.fb||\'\';}else{this.remove();}">' : '');
  }
  return '<span class="glyph">&lt;/&gt;</span>';
}

function cardHTML(it,idx){
  const isLink = it.type === 'link';
  const delay = Math.min(idx*22,380);
  const saved = !isLink && hasSavedEntries(it);
  const hasIcon = !!it.icon;
  const thumbClass = isLink ? 'link' : 'html';
  const style = !isLink && !it.icon ? 'style="--g1:'+gradFor(it.id)[0]+';--g2:'+gradFor(it.id)[1]+'"' : '';

  const dotBadge = saved ? '<span class="saved-dot">💾 '+countEntries(it)+'</span>' : '';
  const iconBadge = hasIcon ? '<span class="icon-dot">🎨</span>' : '';

  return '<article class="card" data-id="'+esc(it.id)+'" style="animation-delay:'+delay+'ms">' +
    '<div class="thumb '+thumbClass+'" '+style+'>' +
    iconHTML(it) + dotBadge + iconBadge +
    '<button class="card-menu" data-menu="'+esc(it.id)+'">⋮</button>' +
    '</div>' +
    '<div class="card-body">' +
    '<div class="card-name">'+esc(it.name)+'</div>' +
    '<span class="badge '+(isLink?'link':'html')+'">'+(isLink?'Website':'HTML')+'</span>' +
    '</div></article>';
}

/* ============ SHEET ACTIONS ============ */
sheetBody.addEventListener('click', async (e)=>{
  const eb = e.target.closest('[data-emoji]');
  if(eb){
    const emoji = eb.dataset.emoji;
    const it = items.find(x=>x.id === iconTargetId);
    if(it){
      it.icon = emoji;
      await Store.put(it);
      render();
      $$('.emoji-btn').forEach(b => b.classList.toggle('selected', b.dataset.emoji === emoji));
      toast('🎨 Icon set');
    }
    return;
  }

  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const act = btn.dataset.act, id = btn.dataset.id;

  switch(act){
    case 'close': closeSheet(); break;
    case 'pick-file': closeSheet(); setTimeout(()=>filePicker.click(),220); break;
    case 'pick-link': addLinkSheet(); break;

    case 'save-link': {
      const u = ($('#inUrl')||{}).value || '';
      const n = ($('#inName')||{}).value || '';
      if(!u.trim()){ toast('URL daalein'); return; }
      await addLink(u, n); break;
    }

    case 'open': closeSheet(); setTimeout(()=>openViewer(id),200); break;
    case 'info': itemInfoSheet(id); break;
    case 'icon': iconPickerSheet(id); break;

    case 'upload-icon':
      setTimeout(()=>iconPicker.click(), 80);
      break;

    case 'remove-icon': {
      const it = items.find(x=>x.id === iconTargetId);
      if(it){ delete it.icon; await Store.put(it); render(); toast('🚫 Icon removed'); }
      closeSheet(); break;
    }

    case 'external': {
      const it = items.find(x=>x.id===id);
      if(it) window.open(it.url,'_blank','noopener'); break;
    }

    case 'capture': {
      const it = items.find(x=>x.id===id); if(!it) return;
      closeSheet();
      if(viewer.hidden){ setTimeout(()=>openViewer(id),200); }
      else{ try{ vFrame.contentWindow.postMessage({__webbox:'request'},'*'); }catch(e){} toast('💾 Entries refresh'); }
      break;
    }

    case 'clear-entries': {
      const it = items.find(x=>x.id===id); if(!it) return;
      delete it.liveState; await Store.put(it); render(); closeSheet();
      toast('🧽 Entries clear ho gayin'); break;
    }

    case 'download': downloadHTML(id); break;
    case 'export-one': exportSingleItem(id); break;
    case 'rename': renameSheet(id); break;

    case 'rename-save': {
      const v = ($('#rnInput')||{}).value || '';
      const it = items.find(x=>x.id===id);
      if(it && v.trim()){ it.name = v.trim(); await Store.put(it); render(); toast('✏️ Renamed'); }
      closeSheet(); break;
    }

    case 'delete': deleteSheet(id); break;

    case 'delete-confirm': {
      const it = items.find(x=>x.id===id); if(!it) return;
      it.deletedAt = Date.now();
      await Store.put(it);
      render(); closeSheet();
      toast('🗑️ Trash me bhej diya');
      break;
    }

    case 'restore-item': {
      const it = items.find(x=>x.id===id); if(!it) return;
      delete it.deletedAt;
      await Store.put(it);
      render(); trashSheet();
      toast('♻️ Restore ho gaya');
      break;
    }

    case 'purge-item': {
      await Store.del(id);
      items = items.filter(x=>x.id!==id);
      render(); trashSheet();
      toast('💥 Permanently deleted');
      break;
    }

    case 'empty-trash': {
      const trashed = trashedItems();
      for(const t of trashed){ await Store.del(t.id); }
      items = items.filter(x => !x.deletedAt);
      render(); trashSheet();
      toast('💥 Trash empty');
      break;
    }

    case 'open-trash': trashSheet(); break;

    case 'backup': backupSheet(); break;
    case 'backup-now': await exportJSON(); closeSheet(); break;

    case 'export-portable':
      closeSheet();
      setTimeout(()=>exportPortableHTML(), 220);
      break;

    case 'restore': closeSheet(); setTimeout(()=>jsonPicker.click(),220); break;
    case 'clearall': clearSheet(); break;

    case 'clear-confirm':
      await Store.clear(); items = []; render(); closeSheet();
      toast('🧹 Sab clear ho gaya'); break;
  }
});

/* ============ ADD ============ */
async function addLink(url, name){
  url = String(url).trim();
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  let host = '';
  try{ host = new URL(url).hostname.replace(/^www\./,''); }
  catch(e){ toast('❌ Invalid URL'); return; }
  const it = {id: uid(), type:'link', url, name:(name&&name.trim())?name.trim():host, createdAt: Date.now(), icon:null, deletedAt:null};
  await Store.put(it); items.push(it); render(); closeSheet();
  toast('✅ Website added'); searchInp.value = '';
}

async function handleFiles(fileList){
  const files = [...fileList].filter(f =>
    /\.html?$/i.test(f.name) || f.type === 'text/html' || f.type === '');
  if(!files.length){ toast('❌ Koi HTML file nahi mili'); return; }
  toast('⏳ Adding ' + files.length + ' file(s)...');
  for(const f of files){
    let text = '';
    try{ text = await f.text(); }catch(e){ continue; }
    const lines = text ? text.split(/\r?\n/).length : 0;
    const it = {
      id: uid(), type: 'html',
      name: f.name.replace(/\.html?$/i,'') || 'Untitled',
      content: text, fileName: f.name,
      mimeType: f.type || 'text/html',
      fileSize: f.size || text.length,
      charCount: text.length, lineCount: lines,
      lastModified: f.lastModified || Date.now(),
      createdAt: Date.now(),
      liveState: null, icon: null, deletedAt: null
    };
    await Store.put(it); items.push(it);
  }
  render();
  toast('✅ ' + files.length + ' file(s) added');
  filePicker.value = '';
}

async function handleIconFile(file){
  if(!file) return;
  if(file.size > 200 * 1024){ toast('❌ Image 200KB se chhoti honi chahiye'); return; }
  const reader = new FileReader();
  reader.onload = async () => {
    const it = items.find(x=>x.id === iconTargetId);
    if(it){
      it.icon = reader.result;
      await Store.put(it);
      render();
      toast('🖼️ Image icon set');
    }
  };
  reader.readAsDataURL(file);
  iconPicker.value = '';
}

/* ============ SERIALIZE ============ */
function serializeItem(i){
  if(i.type === 'html'){
    return {
      id: i.id, type:'html', name: i.name,
      fileName: i.fileName || (i.name + '.html'),
      mimeType: i.mimeType || 'text/html',
      content: i.content || '',
      fileSize: i.fileSize || (i.content ? i.content.length : 0),
      charCount: i.charCount || (i.content ? i.content.length : 0),
      lineCount: i.lineCount || (i.content ? i.content.split(/\r?\n/).length : 0),
      lastModified: i.lastModified || i.createdAt,
      createdAt: i.createdAt,
      liveState: i.liveState || null,
      icon: i.icon || null,
      deletedAt: i.deletedAt || null
    };
  }
  return {
    id: i.id, type:'link', name: i.name,
    url: i.url, createdAt: i.createdAt,
    icon: i.icon || null,
    deletedAt: i.deletedAt || null
  };
}

/* ============ EXPORT JSON ============ */
async function exportJSON(){
  if(currentItem && currentItem.type === 'html' && !viewer.hidden){
    try{ vFrame.contentWindow.postMessage({__webbox:'request'},'*'); }catch(e){}
    await new Promise(r=>setTimeout(r, 400));
    const idx = items.findIndex(x=>x.id === currentItem.id);
    if(idx >= 0 && currentItem.liveState) items[idx].liveState = currentItem.liveState;
  }
  const fullItems = items.map(serializeItem);
  const htmlItems = fullItems.filter(i=>i.type==='html');
  const linkItems = fullItems.filter(i=>i.type==='link');
  const totalChars = htmlItems.reduce((a,b)=>a+b.charCount,0);
  const totalLines = htmlItems.reduce((a,b)=>a+b.lineCount,0);
  let totalEntries = 0;
  htmlItems.forEach(i=>{
    if(i.liveState){
      totalEntries += Object.keys(i.liveState.localStorage||{}).length +
        Object.keys(i.liveState.sessionStorage||{}).length +
        Object.keys(i.liveState.formValues||{}).length;
    }
  });
  const data = {
    app:'WebBox', version:6, exportedAt:new Date().toISOString(),
    count: fullItems.length,
    stats: {
      htmlCount: htmlItems.length, linkCount: linkItems.length,
      totalHtmlChars: totalChars, totalHtmlLines: totalLines,
      totalSavedEntries: totalEntries, trashedCount: trashedItems().length
    },
    items: fullItems
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'webbox-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  toast('💾 Backup ready -- ' + fmtBytes(blob.size) + ' | ' + totalEntries + ' entries');
}

/* ============================================================
   ★ PORTABLE HTML EXPORT ★
   ============================================================ */
function exportPortableHTML(){
  const doExport = () => {
    // 1. Serialize all items (with live entries)
    const portable = items.map(serializeItem);

    // 2. Count what we're exporting
    let totalEntries = 0;
    portable.forEach(it => {
      if(it.liveState){
        totalEntries += Object.keys(it.liveState.formValues||{}).length +
                        Object.keys(it.liveState.localStorage||{}).length +
                        Object.keys(it.liveState.sessionStorage||{}).length;
      }
    });

    // 3. Unique export ID (used by portable HTML to detect new data)
    const exportId = 'exp-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);

    // 4. Build safe JSON (escape <, >, and line separators)
    let jsonStr;
    try {
      jsonStr = JSON.stringify(portable)
        .replace(/</g, '\\u003c')
        .replace(/>/g, '\\u003e')
        .replace(/\u2028/g, '\\u2028')
        .replace(/\u2029/g, '\\u2029');
    } catch(e) {
      toast('❌ Export failed: ' + e.message);
      return;
    }

    // 5. Remove any prior portable-data script from the pristine HTML
    let html = PRISTINE_HTML;
    html = html.replace(/<script[^>]*id=["']__webbox_portable_data__["'][^>]*>[\s\S]*?<\s*\/\s*script\s*>/gi, '');
    html = html.replace(/<script[^>]*id=["']__webbox_portable_id__["'][^>]*>[\s\S]*?<\s*\/\s*script\s*>/gi, '');

    // 6. Build the injection (script split to avoid HTML parser issues)
    const SCRIPT_OPEN  = '<' + 'script id="__webbox_portable_data__">';
    const SCRIPT_CLOSE = '<' + '/' + 'script>';
    const injection =
      SCRIPT_OPEN +
        'window.__WEBBOX_PORTABLE_DATA__=' + jsonStr + ';' +
        'window.__WEBBOX_PORTABLE_ID__="' + exportId + '";' +
      SCRIPT_CLOSE;

    // 7. Inject right after <body> (runs before main app script)
    if(/<body[^>]*>/i.test(html)){
      html = html.replace(/<body[^>]*>/i, m => m + injection);
    } else if(/<html[^>]*>/i.test(html)){
      html = html.replace(/<html[^>]*>/i, m => m + '<body>' + injection);
    } else {
      html = injection + html;
    }

    // 8. Download
    const blob = new Blob([html], {type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'webbox-portable-' + new Date().toISOString().slice(0,10) + '.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 8000);

    console.log('[WebBox] Portable export:', {
      items: portable.length,
      entries: totalEntries,
      exportId,
      size: blob.size
    });

    toast('🌐 Exported: ' + portable.length + ' items, ' + totalEntries + ' entries');
  };

  // If a viewer is open, request fresh state first
  if(currentItem && currentItem.type === 'html' && !viewer.hidden){
    try{ vFrame.contentWindow.postMessage({__webbox:'request'},'*'); }catch(e){}
    setTimeout(()=>{
      const idx = items.findIndex(x=>x.id === currentItem.id);
      if(idx >= 0 && currentItem.liveState) items[idx].liveState = currentItem.liveState;
      doExport();
    }, 500);
  } else {
    setTimeout(doExport, 100);
  }
}

/* ============ IMPORT JSON ============ */
async function importJSON(file){
  try{
    const txt = await file.text();
    const data = JSON.parse(txt);
    const list = Array.isArray(data) ? data : (data && data.items);
    if(!Array.isArray(list)) throw new Error('bad format');
    let n = 0, nE = 0, nT = 0;
    for(const raw of list){
      if(!raw || typeof raw !== 'object') continue;
      const content = raw.content || '';
      const liveState = raw.liveState || null;
      const it = {
        id: raw.id || uid(),
        type: raw.type === 'link' ? 'link' : 'html',
        name: raw.name || 'Untitled',
        url: raw.url || '',
        content, fileName: raw.fileName || (raw.name ? raw.name + '.html' : ''),
        mimeType: raw.mimeType || 'text/html',
        fileSize: raw.fileSize || raw.size || content.length,
        charCount: raw.charCount || content.length,
        lineCount: raw.lineCount || (content ? content.split(/\r?\n/).length : 0),
        lastModified: raw.lastModified || raw.createdAt || Date.now(),
        createdAt: raw.createdAt || Date.now(),
        liveState, icon: raw.icon || null, deletedAt: raw.deletedAt || null
      };
      if(it.type === 'link' && !it.url) continue;
      if(it.liveState){
        nE += Object.keys(it.liveState.localStorage||{}).length +
              Object.keys(it.liveState.sessionStorage||{}).length +
              Object.keys(it.liveState.formValues||{}).length;
      }
      if(it.deletedAt) nT++;
      const idx = items.findIndex(x=>x.id === it.id);
      if(idx >= 0) items[idx] = it; else items.push(it);
      await Store.put(it);
      n++;
    }
    render();
    toast('✅ ' + n + ' items restored' + (nE ? ' | ' + nE + ' entries' : '') + (nT ? ' | ' + nT + ' in trash' : ''));
  }catch(e){
    console.error(e);
    toast('❌ Invalid backup file');
  }finally{
    jsonPicker.value = '';
  }
}

/* ============ VIEWER ============ */
function openViewer(id){
  const it = items.find(x=>x.id===id); if(!it) return;
  currentItem = it;
  vTitle.textContent = it.name;
  if(blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl = null; }
  if(it.type === 'html'){
    const html = buildHTMLWithBridge(it);
    const blob = new Blob([html], {type:'text/html;charset=utf-8'});
    blobUrl = URL.createObjectURL(blob);
    vFrame.setAttribute('sandbox',
      'allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation');
    vFrame.src = blobUrl;
    vNote.hidden = true;
    vLive.hidden = false;
    vLiveText.textContent = '💾 Entries auto-capture ho rahi hain...';
  }else{
    vFrame.removeAttribute('sandbox');
    vFrame.src = it.url;
    vNote.hidden = false;
    vLive.hidden = true;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(()=>{ vNote.hidden = true; }, 7000);
  }
  viewer.hidden = false;
  document.body.classList.add('lock');
  requestAnimationFrame(()=> viewer.classList.add('open'));
  try{ history.pushState({viewer:true}, ''); }catch(e){}
}

async function closeViewer(){
  if(currentItem && currentItem.type === 'html' && !viewer.hidden){
    try{ vFrame.contentWindow.postMessage({__webbox:'request'},'*'); }catch(e){}
    await new Promise(r=>setTimeout(r, 320));
    if(currentItem.liveState){
      const idx = items.findIndex(x=>x.id === currentItem.id);
      if(idx >= 0){
        items[idx].liveState = currentItem.liveState;
        try{ await Store.put(items[idx]); }catch(e){}
      }
    }
  }
  viewer.classList.remove('open');
  viewer.classList.remove('immersive');
  document.body.classList.remove('lock');
  clearTimeout(noteTimer);
  vLive.hidden = true;
  setTimeout(()=>{
    viewer.hidden = true;
    vFrame.src = 'about:blank';
    if(blobUrl){ URL.revokeObjectURL(blobUrl); blobUrl = null; }
    currentItem = null;
    render();
  }, 230);
  if(document.fullscreenElement || document.webkitFullscreenElement){
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  }
}

function toggleFullscreen(){
  const el = viewer;
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if(isFs){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(req){ try{ const p = req.call(el); if(p && p.catch) p.catch(()=> el.classList.toggle('immersive')); }catch(e){ el.classList.toggle('immersive'); } }
  else{ el.classList.toggle('immersive'); }
}

/* ============ EVENTS ============ */
$('#fab').addEventListener('click', addSheet);
$('#menuBtn').addEventListener('click', menuSheet);
$('#trashBtn').addEventListener('click', trashSheet);
$('#searchBtn').addEventListener('click', ()=>{

searchInp.addEventListener('input', render);

grid.addEventListener('click', (e)=>{

  const card = e.target.closest('.card');

$('#vClose').addEventListener('click', closeViewer);
$('#vSave').addEventListener('click', ()=>{
  if(!currentItem) return;
  try{ vFrame.contentWindow.postMessage({__webbox:'request'},'*'); }catch(e){}
  setTimeout(async ()=>{
    if(currentItem && currentItem.liveState){
      const idx = items.findIndex(x=>x.id === currentItem.id);
      if(idx >= 0){
        items[idx].liveState = currentItem.liveState;
        await Store.put(items[idx]);
        toast('💾 ' + countEntries(currentItem) + ' entries saved');

});
$('#vReload').addEventListener('click', ()=>{
  if(!currentItem) return;
  if(currentItem.type === 'html' && blobUrl){
    vFrame.src = 'about:blank';
    setTimeout(()=>{ vFrame.src = blobUrl; }, 60);
  }else{ vFrame.src = vFrame.src; }
});
$('#vFs').addEventListener('click', toggleFullscreen);
$('#vOpen').addEventListener('click', ()=>{
  if(!currentItem) return;
  if(currentItem.type === 'link') window.open(currentItem.url, '_blank', 'noopener');
  else if(blobUrl) window.open(blobUrl, '_blank', 'noopener');
});

filePicker.addEventListener('change', (e)=>{
  if(e.target.files && e.target.files.length) handleFiles(e.target.files);
});
jsonPicker.addEventListener('change', (e)=>{
  if(e.target.files && e.target.files[0]) importJSON(e.target.files[0]);
});
iconPicker.addEventListener('change', (e)=>{
  if(e.target.files && e.target.files[0]) handleIconFile(e.target.files[0]);
});

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    if(!viewer.hidden) closeViewer();
    else if(sheet.classList.contains('show')) closeSheet();
  }
});
window.addEventListener('popstate', ()=>{ if(!viewer.hidden) closeViewer(); });
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>{
  document.addEventListener(ev, ()=>{
    const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    $('#vFs').textContent = on ? '⤡' : '⛶';
  });
});

/* ============ AUTO-PURGE TRASH ============ */
async function purgeTrash(){
  const now = Date.now();
  const expired = items.filter(i => i.deletedAt && (now - i.deletedAt) > TRASH_MS);
  if(!expired.length) return;
  for(const it of expired){ await Store.del(it.id); }
  items = items.filter(i => !expired.includes(i));
  console.log('[WebBox] Auto-purged ' + expired.length + ' items from trash');
}

/* ============ PWA manifest ============ */
(function injectManifest(){
  try{
    const icon = 'data:image/svg+xml;base64,' + btoa(
      '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">' +
      '<rect width="512" height="512" rx="112" fill="#4f7dff"/>' +
      '<text x="256" y="330" font-size="240" font-family="sans-serif" font-weight="bold" ' +
      'fill="#fff" text-anchor="middle">◈</text></svg>');
    const manifest = {name:'WebBox', short_name:'WebBox', start_url: location.href,
      scope:'./', display:'standalone', background_color:'#080b12', theme_color:'#080b12',
      icons:[{src:icon, sizes:'512x512', type:'image/svg+xml', purpose:'any maskable'}]};
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  }catch(e){}
})();

/* ============================================================
   ★ BOOT ★
   Portable data detection:
   - If __WEBBOX_PORTABLE_DATA__ exists AND its ID is NEW
     (different from last-seen), load it (wipe existing).
   - If same ID as before, use IndexedDB (user's changes).
   - If no portable data, use IndexedDB.
   ============================================================ */
async function boot(){
  const embeddedData = window.__WEBBOX_PORTABLE_DATA__;
  const embeddedId   = window.__WEBBOX_PORTABLE_ID__;
  const lastSeenId   = safeLsGet(EXPORT_ID_STORAGE);

  const hasEmbedded  = Array.isArray(embeddedData);
  const isFresh      = hasEmbedded && embeddedId && (embeddedId !== lastSeenId);

  console.log('[WebBox] Boot', {
    hasEmbedded,
    embeddedCount: hasEmbedded ? embeddedData.length : 0,
    embeddedId,
    lastSeenId,
    isFresh
  });

  try{
    if(isFresh){
      // Fresh portable HTML -- replace everything with embedded data
      await Store.clear();
      for(const it of embeddedData){ await Store.put(it); }
      items = embeddedData.slice();
      safeLsSet(EXPORT_ID_STORAGE, embeddedId);
      console.log('[WebBox] Loaded FRESH embedded data: ' + items.length + ' items');
    } else {
      // Normal mode or re-opening same portable -- use IndexedDB
      items = await Store.all();
      // Edge case: brand-new open but embedded exists and DB empty
      if((!items || items.length === 0) && hasEmbedded){
        for(const it of embeddedData){ await Store.put(it); }
        items = embeddedData.slice();
        if(embeddedId) safeLsSet(EXPORT_ID_STORAGE, embeddedId);
        console.log('[WebBox] Seeded from embedded (empty DB): ' + items.length + ' items');
      }
    }
    if(!Array.isArray(items)) items = [];
  }catch(e){
    console.error('[WebBox] Boot error:', e);
    items = hasEmbedded ? embeddedData.slice() : [];
  }

  // Ensure required fields
  items = items.map(i => {
    if(typeof i.icon === 'undefined') i.icon = null;
    if(typeof i.deletedAt === 'undefined') i.deletedAt = null;
    return i;
  });

  // Show a toast if we loaded fresh portable data
  if(isFresh && items.length > 0){
    setTimeout(()=>{
      let totalE = 0;
      items.forEach(i=>{ if(i.type==='html') totalE += countEntries(i); });
      toast('🌐 Portable data loaded -- ' + items.length + ' items, ' + totalE + ' entries');
    }, 500);
  }

  await purgeTrash();
  render();
}

boot();

})();
